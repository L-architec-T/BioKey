name: Release
# One tag = one release with every app: push `vX.Y.Z` (matching the repo-root VERSION file) and
# this builds the Android APK and the desktop app for Windows/Linux/macOS, then publishes them
# together. Nothing is published unless every build succeeded. Run it by hand
# (workflow_dispatch) to build everything without publishing.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  QT_VERSION: 6.10.2

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{steps.read.outputs.version}}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches VERSION
        id: read
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version)."
            exit 1
          fi

  build-android:
    needs: version
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore secrets
        env:
          GOOGLE_SERVICES_JSON: ${{secrets.GOOGLE_SERVICES_JSON}}
          BIOKEY_KEYSTORE_BASE64: ${{secrets.BIOKEY_KEYSTORE_BASE64}}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$BIOKEY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/biokey-release.jks"

      - name: Test and build signed APK (R8)
        env:
          BIOKEY_KEYSTORE_FILE: ${{runner.temp}}/biokey-release.jks
          BIOKEY_STORE_PASSWORD: ${{secrets.BIOKEY_STORE_PASSWORD}}
          BIOKEY_KEY_ALIAS: ${{secrets.BIOKEY_KEY_ALIAS}}
          BIOKEY_KEY_PASSWORD: ${{secrets.BIOKEY_KEY_PASSWORD}}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleRelease
          # Fixed asset name: the in-app updater and share links download biokey.apk.
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/biokey.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: biokey.apk
          path: ${{runner.temp}}/biokey.apk
          if-no-files-found: error

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: android-r8-mapping-${{needs.version.outputs.version}}
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

  build-windows-x64:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Qt x64
        uses: jurplel/install-qt-action@v4
        with:
          dir: "C:/"
          version: "${{env.QT_VERSION}}"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          cache: "true"
          cache-key-prefix: "qt-x64"

      - name: Checkout vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 1

      - name: Resolve vcpkg revision
        id: vcpkg-rev
        shell: bash
        run: echo "sha=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg binaries x64
        uses: actions/cache@v4
        with:
          path: ${{runner.temp}}/vcpkg_cache
          key: "${{runner.os}}-x64-vcpkg-${{steps.vcpkg-rev.outputs.sha}}-${{hashFiles('cmake/vcpkg-triplets/*.cmake')}}-openssl"
          restore-keys: "${{runner.os}}-x64-vcpkg-"

      - name: Bootstrap vcpkg
        shell: cmd
        working-directory: vcpkg
        run: bootstrap-vcpkg.bat

      - name: vcpkg build x64
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{runner.temp}}/vcpkg_cache
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ./vcpkg/vcpkg.exe install --overlay-triplets=cmake/vcpkg-triplets --triplet x64-windows-static openssl
          ./vcpkg/vcpkg.exe install --overlay-triplets=cmake/vcpkg-triplets --triplet x64-windows-static-md openssl

      - name: Build x64
        run: bash -c "cd pkg && chmod +x build-desktop.sh && ARCH=x64 QT_BASE_DIR=C:/Qt/${{env.QT_VERSION}} ./build-desktop.sh"
        env:
          VCPKG_ROOT: ${{github.workspace}}/vcpkg

      - name: Upload x64
        uses: actions/upload-artifact@v4
        with:
          name: BioKey-Setup-x64.exe
          path: pkg/build/BioKey-Setup-x64.exe
          if-no-files-found: error

  build-windows-arm64:
    needs: version
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Workaround Qt install bug
        shell: pwsh
        run: |
          $target = "C:\Qt\${{env.QT_VERSION}}\msvc2022_arm64\bin"
          New-Item -Path $target -ItemType Directory -Force | Out-Null
          Set-Location $target

          # qmake.bat
          @"
          @echo off
          \Users\qt\work\install\bin\qmake6.exe -qtconf "%~dp0\target_qt.conf" %*  
          "@ | Out-File -FilePath "qmake.bat" -Encoding ascii -Force

          # qmake6.bat
          @"
          @echo off
          \Users\qt\work\install\bin\qmake6.exe -qtconf "%~dp0\target_qt.conf" %*
          "@ | Out-File -FilePath "qmake6.bat" -Encoding ascii -Force

          # qtpaths.bat
          @"
          @echo off
          \Users\qt\work\install\bin\qtpaths6.exe -qtconf "%~dp0\target_qt.conf" %*
          "@ | Out-File -FilePath "qtpaths.bat" -Encoding ascii -Force

          # qtpaths6.bat
          @"
          @echo off
          \Users\qt\work\install\bin\qtpaths6.exe -qtconf "%~dp0\target_qt.conf" %*
          "@ | Out-File -FilePath "qtpaths6.bat" -Encoding ascii -Force

      - name: Install Qt arm64
        uses: jurplel/install-qt-action@v4
        with:
          dir: "C:/"
          version: "${{env.QT_VERSION}}"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_arm64_cross_compiled"
          cache: "true"
          cache-key-prefix: "qt-arm64"

      - name: Checkout vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          fetch-depth: 1

      - name: Resolve vcpkg revision
        id: vcpkg-rev
        shell: bash
        run: echo "sha=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache vcpkg binaries arm64
        uses: actions/cache@v4
        with:
          path: ${{runner.temp}}/vcpkg_cache
          key: "${{runner.os}}-arm64-vcpkg-${{steps.vcpkg-rev.outputs.sha}}-${{hashFiles('cmake/vcpkg-triplets/*.cmake')}}-openssl"
          restore-keys: "${{runner.os}}-arm64-vcpkg-"

      - name: Bootstrap vcpkg
        shell: cmd
        working-directory: vcpkg
        run: bootstrap-vcpkg.bat

      - name: vcpkg build arm64
        shell: bash
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{runner.temp}}/vcpkg_cache
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          ./vcpkg/vcpkg.exe install --overlay-triplets=cmake/vcpkg-triplets --triplet arm64-windows-static openssl
          ./vcpkg/vcpkg.exe install --overlay-triplets=cmake/vcpkg-triplets --triplet arm64-windows-static-md openssl

      - name: Build arm64
        run: bash -c "cd pkg && rm -Rf ./build/ && ARCH=arm64 QT_BASE_DIR=C:/Qt/${{env.QT_VERSION}} ./build-desktop.sh"
        env:
          VCPKG_ROOT: ${{github.workspace}}/vcpkg

      - name: Upload arm64
        uses: actions/upload-artifact@v4
        with:
          name: BioKey-Setup-arm64.exe
          path: pkg/build/BioKey-Setup-arm64.exe
          if-no-files-found: error

  build-linux-x64:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build docker
        run: bash -c "cd ${{github.workspace}}/pkg/linux && chmod +x docker-build.sh && ARCH=x64 ./docker-build.sh"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BioKey-x64.AppImage
          path: pkg/build/BioKey-x64.AppImage
          if-no-files-found: error

  build-linux-arm64:
    needs: version
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build docker
        run: bash -c "cd ${{github.workspace}}/pkg/linux && chmod +x docker-build.sh && ARCH=arm64 ./docker-build.sh"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BioKey-arm64.AppImage
          path: pkg/build/BioKey-arm64.AppImage
          if-no-files-found: error

  build-mac-arm64:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Prepare Qt
        run: sudo chmod 777 /opt
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          dir: "/opt"
          version: "${{env.QT_VERSION}}"
          host: "mac"
          target: "desktop"
          arch: "clang_64"
          cache: "true"

      - name: Build
        run: bash -c "cd pkg && rm -Rf ./build/ && ARCH=arm64 QT_BASE_DIR=/opt/Qt/${{env.QT_VERSION}} CI_BUILD=1 ./build-desktop.sh"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: BioKey-arm64.dmg
          path: pkg/build/BioKey-arm64.dmg
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [version, build-android, build-windows-x64, build-windows-arm64, build-linux-x64, build-linux-arm64, build-mac-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          rm -f dist/mapping.txt # R8 mapping stays a workflow artifact, not a public download
          ls -la dist
          notes=(--generate-notes)
          [[ -s RELEASE_NOTES.md ]] && notes=(--notes-file RELEASE_NOTES.md)
          gh release create "$GITHUB_REF_NAME" dist/* --title "BioKey $GITHUB_REF_NAME" "${notes[@]}"
